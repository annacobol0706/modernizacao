# Configuracao do AnyCompany Gateway
# Valores ${...} vem de variavel de ambiente ou -D no setenv.sh do Tomcat

db.url=jdbc:sqlserver://sqlserver:1433;databaseName=AnyCompany
db.usuario=sa
db.senha=${DB_SENHA}
