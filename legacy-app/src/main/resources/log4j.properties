log4j.rootLogger=INFO, console, arquivo

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1} - %m%n

log4j.appender.arquivo=org.apache.log4j.RollingFileAppender
log4j.appender.arquivo.File=/usr/local/tomcat/logs/anycompany.log
log4j.appender.arquivo.MaxFileSize=50MB
log4j.appender.arquivo.MaxBackupIndex=10
log4j.appender.arquivo.layout=org.apache.log4j.PatternLayout
log4j.appender.arquivo.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1} - %m%n

log4j.logger.br.com.anycompany=INFO
log4j.logger.org.hibernate=WARN
log4j.logger.org.springframework=WARN
log4j.logger.org.apache.cxf=WARN
