# Mesmo papel do lb01 em producao: distribui as requisicoes entre as instancias do Tomcat.
upstream anycompany {
    server app:8080;
    server app2:8080;
}

server {
    listen 80;

    location /anycompany/ {
        proxy_pass http://anycompany;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
